name: Deploy to GitHub Pages

# Publishes the web build to https://thuenen-forest-ecosystems.github.io/TFM-client-app/
# on every release, alongside the Windows and Android builds.
on:
  release:
    types: [published]
  workflow_dispatch:

# Only one Pages deploy at a time; a newer release supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"
          cache: true

      - name: Download Dependencies
        run: flutter pub get

      - name: "Create .env file from secrets"
        run: |
          touch .env
          echo "DMZ_KEY=${{ secrets.DMZ_KEY }}" >> .env

      - name: Build
        run: flutter build web --release --base-href "/TFM-client-app/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
